<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Minha Rotina</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap" id="main">
  <header class="top">
    <div class="titles">
      <div class="eyebrow" id="eyebrow">Hoje</div>
      <h1 id="dateTitle">—</h1>
    </div>
    <div class="prog" id="prog" aria-live="polite"></div>
  </header>

  <div class="weekbar">
    <button class="arrow" id="prev" aria-label="Dia anterior">‹</button>
    <div class="week" id="week" role="tablist" aria-label="Semana"></div>
    <button class="arrow" id="next" aria-label="Próximo dia">›</button>
  </div>
  <button class="today-btn" id="goToday" hidden>Voltar para hoje</button>

  <div class="status" id="status" hidden></div>
  <div id="celebrate" hidden></div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden></div>
  <button class="link" id="testBtn" hidden>Testar despertador</button>
</div>

<button class="fab" id="addBtn" aria-label="Nova tarefa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast" hidden></div>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" novalidate>
    <h2 id="formTitle">Nova tarefa</h2>
    <label class="field"><span class="lbl">O que fazer</span><input type="text" id="f-title" maxlength="120" placeholder="Ex.: Ir à academia" autocomplete="off"></label>
    <label class="field"><span class="lbl">Horário</span><input type="time" id="f-time"></label>
    <div class="field">
      <span class="lbl">Quando</span>
      <div class="opts">
        <label><input type="radio" name="rep" id="rep-daily" value="daily"><span>Todo dia</span></label>
        <label><input type="radio" name="rep" id="rep-weekly" value="weekly"><span>Alguns dias</span></label>
        <label><input type="radio" name="rep" id="rep-once" value="once"><span>Uma vez</span></label>
      </div>
    </div>
    <div class="field" id="wdField"><div class="wds" id="wds"></div></div>
    <label class="field" id="dateField"><span class="lbl">Dia</span><input type="date" id="f-date"></label>
    <div class="field">
      <span class="lbl">No horário</span>
      <div class="opts">
        <label><input type="radio" name="alert" id="al-none" value="none"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M6 18 18 6"/></svg>Nada</span></label>
        <label><input type="radio" name="alert" id="al-notify" value="notify"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>Aviso</span></label>
        <label><input type="radio" name="alert" id="al-alarm" value="alarm"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M5 3.5 2.5 6M19 3.5 21.5 6"/></svg>Despertador</span></label>
      </div>
    </div>
    <p class="err" id="formErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="cancelBtn">Cancelar</button>
      <button type="submit" class="btn primary" id="saveBtn">Salvar</button>
    </div>
    <button type="button" class="btn danger" id="delBtn" hidden>Excluir tarefa</button>
  </form>
</div>

<script src="capacitor.js"></script>
<script>
(() => {
  const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  const WD_LONG = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return toStr(d); };
  const today = () => toStr(new Date());
  const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
  const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  // ---------- ponte com o Android ----------
  const Cap = window.capacitorExports;
  const native = !!(Cap && Cap.Capacitor.isNativePlatform());
  const Prefs = native ? Cap.registerPlugin("Preferences") : null;
  const Rotina = native ? Cap.registerPlugin("Rotina") : null;
  const KEY = "rotina-v1";

  const state = { tasks: new Map(), days: new Map(), sel: today() };

  async function load() {
    try {
      let raw = null;
      if (Prefs) raw = (await Prefs.get({ key: KEY })).value;
      else raw = localStorage.getItem(KEY);
      if (raw) { const o = JSON.parse(raw); state.tasks = new Map(o.tasks); state.days = new Map(o.days); }
    } catch (e) {}
  }
  let syncTimer = null;
  async function save() {
    const raw = JSON.stringify({ tasks: [...state.tasks], days: [...state.days] });
    try { if (Prefs) await Prefs.set({ key: KEY, value: raw }); else localStorage.setItem(KEY, raw); } catch (e) {}
    clearTimeout(syncTimer); syncTimer = setTimeout(syncNative, 250);
  }
  async function syncNative() {
    if (!Rotina) return;
    const t0 = today(), tasks = [], skip = [];
    state.tasks.forEach((t, id) => tasks.push({ id, ...t }));
    state.days.forEach((v, k) => {
      const date = k.slice(2);
      if (date >= t0) Object.keys(v.done || {}).forEach(id => skip.push(id + "|" + date));
    });
    try { await Rotina.sync({ tasks, skip }); } catch (e) { toast("Não consegui agendar os avisos. Abra o app de novo."); }
    refreshStatus();
  }
  async function pullDone() {
    if (!Rotina) return;
    try {
      const { items } = await Rotina.takeDone();
      if (items && items.length) {
        items.forEach(({ taskId, date }) => {
          const key = "d-" + date, done = { ...((state.days.get(key) || {}).done || {}) };
          done[taskId] = true; state.days.set(key, { done });
        });
        render(); save();
      }
    } catch (e) {}
  }

  let toastTimer = null;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4000); }

  // ---------- regras de agenda ----------
  function appliesOn(t, ds) {
    if (t.repeat === "once") return t.date === ds;
    if (t.start && ds < t.start) return false;
    if (t.repeat === "daily") return true;
    if (t.repeat === "weekly") return Array.isArray(t.days) && t.days.includes(parse(ds).getDay());
    return false;
  }
  function tasksFor(ds) {
    const out = [];
    state.tasks.forEach((t, id) => { if (appliesOn(t, ds)) out.push({ id, ...t }); });
    out.sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99") || a.title.localeCompare(b.title));
    return out;
  }
  const doneMap = ds => (state.days.get("d-" + ds) || {}).done || {};
  function stats(ds) { const ts = tasksFor(ds), dm = doneMap(ds); return { total: ts.length, done: ts.filter(t => dm[t.id]).length }; }
  function repeatLabel(t) {
    if (t.repeat === "daily") return "Todo dia";
    if (t.repeat === "once") { const d = parse(t.date); return `Só em ${d.getDate()}/${pad(d.getMonth() + 1)}`; }
    const ds = (t.days || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
    if (ds.length === 5 && ![0, 6].some(x => ds.includes(x))) return "Seg a sex";
    if (ds.length === 7) return "Todo dia";
    return ds.map(x => WD[x][0].toUpperCase() + WD[x].slice(1)).join(", ");
  }
  const alertLabel = t => !t.time ? "" : t.alert === "alarm" ? " · despertador" : t.alert === "notify" ? " · notificação" : "";
  function streak() {
    let ds = today(); const s0 = stats(ds);
    if (!(s0.total && s0.done === s0.total)) ds = addDays(ds, -1);
    let n = 0;
    for (let i = 0; i < 400; i++) { const s = stats(ds); if (s.total) { if (s.done === s.total) n++; else break; } ds = addDays(ds, -1); }
    return n;
  }
  function nextAlert() {
    const hm = nowHM();
    for (let i = 0; i < 8; i++) {
      const ds = addDays(today(), i), dm = doneMap(ds);
      const t = tasksFor(ds).find(t => t.time && (t.alert === "alarm" || t.alert === "notify") && !dm[t.id] && (i > 0 || t.time > hm));
      if (t) return `${i === 0 ? "hoje" : i === 1 ? "amanhã" : WD[parse(ds).getDay()]} às ${t.time} · ${t.title}`;
    }
    return null;
  }

  // ---------- desenho ----------
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--on-accent)"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  const ICON_BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="com aviso"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>';
  const ICON_ALARM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="com despertador"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M5 3.5 2.5 6M19 3.5 21.5 6"/></svg>';
  const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  let lastFull = null, justId = null, slide = "";
  function renderProg(s) {
    const r = 32, c = 2 * Math.PI * r, p = s.total ? s.done / s.total : 0, full = s.total > 0 && s.done === s.total;
    const el = $("prog");
    el.className = "prog" + (full ? " full" : "");
    el.hidden = s.total === 0;
    el.innerHTML = `<svg viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="${r}" fill="${full ? "var(--accent)" : "none"}" stroke="var(--accent-soft)" stroke-width="8"/>` +
      (full ? "" : `<circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * p} ${c}"/>`) +
      `</svg><span class="num">${full ? "✓" : `${s.done}/${s.total}`}</span>`;
    el.setAttribute("aria-label", `${s.done} de ${s.total} feitas`);
    return full;
  }

  function render() {
    const sel = state.sel, t0 = today(), d = parse(sel);
    const diff = Math.round((d - parse(t0)) / 864e5);
    $("eyebrow").textContent = diff === 0 ? "Hoje" : diff === -1 ? "Ontem" : diff === 1 ? "Amanhã" : WD_LONG[d.getDay()];
    $("dateTitle").textContent = `${d.getDate()} de ${MONTHS[d.getMonth()]}`;
    $("goToday").hidden = diff === 0;

    const monday = addDays(sel, -((d.getDay() + 6) % 7));
    const week = $("week"); week.innerHTML = "";
    for (let i = 0; i < 7; i++) {
      const ds = addDays(monday, i), dd = parse(ds), s = stats(ds);
      const b = document.createElement("button");
      b.className = "day" + (ds === sel ? " sel" : "") + (ds === t0 ? " today" : "");
      b.setAttribute("role", "tab"); b.setAttribute("aria-selected", ds === sel);
      b.setAttribute("aria-label", `${WD_LONG[dd.getDay()]} ${dd.getDate()}: ${s.done} de ${s.total} feitas`);
      const dot = !s.total ? "" : s.done === s.total ? " full" : " part";
      b.innerHTML = `<span class="wd">${WD[dd.getDay()]}</span><span class="dn">${dd.getDate()}</span><span class="dot${dot}"></span>`;
      b.onclick = () => go(ds);
      week.appendChild(b);
    }

    const ts = tasksFor(sel), dm = doneMap(sel), s = stats(sel);
    const full = renderProg(s);
    const cel = $("celebrate");
    if (full) {
      const st = streak();
      cel.hidden = false;
      cel.className = "celebrate";
      cel.innerHTML = `<span class="big">🎉</span><span>${diff === 0 ? "Dia completo!" : "Tudo feito neste dia"}${st > 1 && diff === 0 ? `<small>${st} dias seguidos</small>` : ""}</span>`;
      if (lastFull === false) { $("prog").classList.add("pop"); buzz([40, 60, 40]); }
    } else cel.hidden = true;
    lastFull = full;

    let nextId = null;
    if (sel === t0) {
      const hm = nowHM(), pend = ts.filter(t => !dm[t.id] && t.time);
      const n = pend.find(t => t.time >= hm);
      if (n) nextId = n.id;
    }

    const list = $("list"); list.innerHTML = "";
    list.className = "list" + (slide ? " " + slide : ""); slide = "";
    const pending = ts.filter(t => !dm[t.id]), doneTs = ts.filter(t => dm[t.id]);
    const addItem = t => {
      const li = document.createElement("li"), isDone = !!dm[t.id];
      li.className = "item" + (isDone ? " done" : "") + (t.id === nextId ? " next" : "") + (t.id === justId ? " just" : "");
      const row = document.createElement("button");
      row.className = "row";
      row.setAttribute("aria-pressed", isDone);
      row.setAttribute("aria-label", (isDone ? "Feita: " : "Marcar como feita: ") + t.title + (t.time ? ", " + t.time : ""));
      row.onclick = () => toggle(t.id);
      const chk = document.createElement("span"); chk.className = "check"; chk.innerHTML = CHECK;
      const body = document.createElement("span"); body.className = "body";
      const ti = document.createElement("span"); ti.className = "title"; ti.textContent = t.title;
      body.append(ti);
      if (t.time) {
        const w = document.createElement("span"); w.className = "when";
        w.textContent = (t.id === nextId ? "Próxima · " : "") + t.time;
        if (t.alert === "alarm") w.insertAdjacentHTML("beforeend", ICON_ALARM);
        else if (t.alert === "notify") w.insertAdjacentHTML("beforeend", ICON_BELL);
        body.append(w);
      }
      row.append(chk, body);
      const ed = document.createElement("button"); ed.className = "edit"; ed.innerHTML = ICON_EDIT;
      ed.setAttribute("aria-label", "Editar " + t.title); ed.onclick = () => openSheet(t.id);
      li.append(row, ed);
      list.appendChild(li);
    };
    pending.forEach(addItem);
    if (doneTs.length && pending.length) {
      const lb = document.createElement("li"); lb.className = "done-label"; lb.textContent = "Feitas";
      list.appendChild(lb);
    }
    doneTs.forEach(addItem);
    justId = null;

    const empty = $("empty");
    if (state.tasks.size === 0) {
      empty.hidden = false;
      empty.innerHTML = `<h2>Monte sua rotina</h2><p>Toque no + para adicionar sua primeira tarefa.</p>`;
      const b1 = document.createElement("button"); b1.className = "btn primary"; b1.textContent = "Adicionar tarefa"; b1.onclick = () => openSheet(null);
      const b2 = document.createElement("button"); b2.className = "btn"; b2.textContent = "Usar rotina de exemplo"; b2.onclick = seedExample;
      empty.append(b1, b2);
    } else if (ts.length === 0) {
      empty.hidden = false; empty.innerHTML = `<h2>Dia livre</h2><p>Nada marcado para este dia.</p>`;
    } else empty.hidden = true;
    $("testBtn").hidden = !native || ![...state.tasks.values()].some(t => t.alert === "alarm");
    renderStatus();
  }

  function go(ds) {
    if (ds === state.sel) return;
    slide = ds > state.sel ? "slide-l" : "slide-r";
    state.sel = ds; lastFull = null; buzz(8); render();
  }

  // ---------- aviso de permissão (só aparece se faltar algo) ----------
  let perm = null;
  async function refreshStatus() {
    if (!Rotina) return;
    try { perm = await Rotina.status(); } catch (e) { perm = null; }
    renderStatus();
  }
  function renderStatus() {
    const box = $("status");
    const hasAlerts = [...state.tasks.values()].some(t => t.time && t.alert && t.alert !== "none");
    if (!native || !perm || !hasAlerts) { box.hidden = true; return; }
    let title, text, label, fn;
    if (!perm.notifications) {
      title = "Avisos desligados"; text = "Sem essa permissão o despertador não toca.";
      label = "Permitir"; fn = async () => { try { const r = await Rotina.requestNotifications(); if (!r.granted) await Rotina.openSettings({ what: "notifications" }); } catch (e) {} refreshStatus(); };
    } else if (!perm.exact) {
      title = "Alarme pode atrasar"; text = "Permita alarmes no horário exato.";
      label = "Permitir"; fn = () => Rotina.openSettings({ what: "exact" });
    } else if (!perm.fullScreen) {
      title = "Despertador sem tela cheia"; text = "Permita para ele aparecer com a tela bloqueada.";
      label = "Permitir"; fn = () => Rotina.openSettings({ what: "fullscreen" });
    } else { box.hidden = true; return; }
    box.hidden = false; box.innerHTML = "";
    const h = document.createElement("h3"); h.textContent = title;
    const p = document.createElement("p"); p.textContent = text;
    const b = document.createElement("button"); b.className = "btn primary"; b.textContent = label; b.onclick = fn;
    box.append(h, p, b);
  }
  $("testBtn").onclick = async () => {
    try { await Rotina.test({ seconds: 10 }); toast("O despertador toca em 10 segundos. Pode bloquear a tela."); }
    catch (e) { toast("Não consegui agendar o teste."); }
  };

  function toggle(id) {
    const key = "d-" + state.sel, done = { ...doneMap(state.sel) };
    if (done[id]) delete done[id]; else { done[id] = true; justId = id; buzz(25); }
    state.days.set(key, { done });
    render(); save();
  }

  // trocar de dia arrastando o dedo
  let tx = null, ty = null;
  $("main").addEventListener("touchstart", e => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
  $("main").addEventListener("touchend", e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) go(addDays(state.sel, dx < 0 ? 1 : -1));
  }, { passive: true });

  function seedExample() {
    const s = today();
    [
      ["Acordar e beber água", "06:30", "daily", null, "alarm"],
      ["Exercício", "07:00", "weekly", [1, 3, 5], "notify"],
      ["Café da manhã", "07:30", "daily", null, "none"],
      ["Revisar tarefas do dia", "08:00", "weekly", [1, 2, 3, 4, 5], "notify"],
      ["Almoço", "12:00", "daily", null, "none"],
      ["Ler 20 minutos", "21:00", "daily", null, "notify"],
      ["Preparar o dia seguinte", "22:00", "daily", null, "notify"],
    ].forEach(([title, time, repeat, days, alert]) => {
      state.tasks.set("t-" + rid(), { title, time, repeat, days: days || [], start: s, date: "", alert });
    });
    render(); save();
    if (Rotina) Rotina.requestNotifications().then(refreshStatus).catch(() => {});
  }

  // ---------- formulário ----------
  let editing = null, delArmed = false;
  const wds = $("wds");
  [1, 2, 3, 4, 5, 6, 0].forEach(n => {
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" id="wd-${n}" value="${n}"><span>${WD[n]}</span>`;
    wds.appendChild(l);
  });
  function syncRepeat() {
    const r = document.querySelector('input[name="rep"]:checked').value;
    $("wdField").hidden = r !== "weekly";
    $("dateField").hidden = r !== "once";
  }
  document.querySelectorAll('input[name="rep"]').forEach(i => i.onchange = syncRepeat);

  function openSheet(id) {
    editing = id; delArmed = false;
    const t = id ? state.tasks.get(id) : null;
    $("formTitle").textContent = t ? "Editar tarefa" : "Nova tarefa";
    $("f-title").value = t ? t.title : "";
    $("f-time").value = t ? t.time : "";
    $("f-date").value = t ? (t.repeat === "once" ? t.date : (t.start || state.sel)) : state.sel;
    $("rep-" + (t ? t.repeat : "daily")).checked = true;
    $("al-" + (t ? (t.alert || "none") : "notify")).checked = true;
    const days = t && t.repeat === "weekly" ? t.days : [parse(state.sel).getDay()];
    for (let n = 0; n < 7; n++) $("wd-" + n).checked = days.includes(n);
    $("delBtn").hidden = !t; $("delBtn").textContent = "Excluir";
    $("formErr").hidden = true;
    syncRepeat();
    $("overlay").hidden = false;
  }
  function closeSheet() { $("overlay").hidden = true; editing = null; }
  $("cancelBtn").onclick = closeSheet;
  $("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeSheet(); });

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const title = $("f-title").value.trim();
    const repeat = document.querySelector('input[name="rep"]:checked').value;
    const alert = document.querySelector('input[name="alert"]:checked').value;
    const days = [...wds.querySelectorAll("input:checked")].map(i => Number(i.value));
    const date = $("f-date").value || state.sel;
    const time = $("f-time").value || "";
    const err = $("formErr");
    if (!title) { err.textContent = "Escreva o nome da tarefa."; err.hidden = false; return; }
    if (repeat === "weekly" && !days.length) { err.textContent = "Escolha pelo menos um dia da semana."; err.hidden = false; return; }
    if (alert !== "none" && !time) { err.textContent = "Para avisar ou despertar, escolha um horário."; err.hidden = false; return; }
    const id = editing || "t-" + rid();
    state.tasks.set(id, { title, time, alert, repeat, days: repeat === "weekly" ? days : [], date: repeat === "once" ? date : "", start: repeat === "once" ? "" : date });
    if (repeat === "once") state.sel = date;
    closeSheet(); render(); save();
    if (alert !== "none" && Rotina && perm && !perm.notifications) { try { await Rotina.requestNotifications(); } catch (e) {} refreshStatus(); }
  });
  $("delBtn").onclick = () => {
    if (!delArmed) { delArmed = true; $("delBtn").textContent = "Toque de novo para excluir"; return; }
    state.tasks.delete(editing); closeSheet(); render(); save();
  };

  $("addBtn").onclick = () => openSheet(null);
  $("prev").onclick = () => go(addDays(state.sel, -1));
  $("next").onclick = () => go(addDays(state.sel, 1));
  $("goToday").onclick = () => go(today());

  let lastToday = today();
  setInterval(() => {
    const t = today();
    if (t !== lastToday) { if (state.sel === lastToday) state.sel = t; lastToday = t; }
    if ($("overlay").hidden) render();
  }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { pullDone(); refreshStatus(); if ($("overlay").hidden) { state.sel = state.sel || today(); render(); } }
  });
  if (Rotina) Rotina.addListener("done", pullDone);

  (async () => {
    render();
    await load();
    render();
    await pullDone();
    syncNative();
  })();
})();
</script>
</body>
</html>
