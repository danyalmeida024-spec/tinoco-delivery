<style>
/* Layout: palco de demonstração. Celular do cliente à esquerda, gestor de pedidos à direita; no celular, um alterna com o outro.
   Identidade: amarelo e preto da logo Tinoco sobre branco. */
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --surface2:#F7F6F3; --ink:#151515; --muted:#6B675F; --line:#E7E4DC;
  --amber:#FFB200; --amber-2:#F29D00; --amber-soft:#FFF4D9; --on-amber:#151515;
  --dark:#151515; --on-dark:#FFFFFF; --plate:#FFFFFF;
  --ok:#15924A; --violet:#7A45D6; --info:#2563EB; --danger:#D6342B; --wa:#1FA855; --bubble:#E3F6DA;
  --ts:62%; --tl:92%;
  --shadow:0 1px 2px rgba(30,24,10,.06),0 12px 32px rgba(30,24,10,.10);
  --display:'Outfit','Trebuchet MS',sans-serif; --body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0D; --surface:#1A1917; --surface2:#131311; --ink:#F2F0EB; --muted:#A39E94; --line:#2D2B27;
  --amber-soft:#382A08; --dark:#050505; --ok:#3CC274; --violet:#A884F0; --info:#6D9CF5; --danger:#F06A60; --wa:#2BBF64; --bubble:#1E3527;
  --ts:24%; --tl:21%; --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0D; --surface:#1A1917; --surface2:#131311; --ink:#F2F0EB; --muted:#A39E94; --line:#2D2B27;
  --amber-soft:#382A08; --dark:#050505; --ok:#3CC274; --violet:#A884F0; --info:#6D9CF5; --danger:#F06A60; --wa:#2BBF64; --bubble:#1E3527;
  --ts:24%; --tl:21%; --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;padding:0 16px 24px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 30%,transparent)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- barra da demonstração ---------- */
.demo-top{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 14px}
.demo-top .marca{width:44px;height:44px;flex:none}
.demo-top .t{flex:1;min-width:220px}
.demo-top h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demo-top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.pill-demo{background:var(--amber);color:var(--on-amber);font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px}
.btn{border-radius:12px;padding:10px 14px;font-weight:600;background:var(--surface);border:1.5px solid var(--line)}
.btn.escuro{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.seg{display:none;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px;width:100%}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;position:relative}
.seg button.on{background:var(--dark);color:var(--on-dark)}
.seg .badge{position:absolute;top:4px;right:10px;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}

.palco{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}

/* ---------- celular do cliente ---------- */
.celular{width:400px;height:min(840px,calc(100dvh - 110px));min-height:640px;border:10px solid #111;border-radius:46px;overflow:hidden;background:var(--surface2);box-shadow:var(--shadow);position:sticky;top:12px}
.app-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:96px;scrollbar-width:thin}
.capa{height:132px;background:var(--amber);position:relative;overflow:hidden}
.capa::before{content:"";position:absolute;width:280px;height:230px;right:-70px;top:-60px;border-radius:50%;border:34px solid rgba(255,255,255,.28)}
.capa::after{content:"";position:absolute;width:160px;height:130px;left:-50px;bottom:-70px;border-radius:50%;border:22px solid rgba(0,0,0,.07)}
.loja-card{position:relative;margin:-58px 14px 0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.plate{grid-row:span 2;width:92px;height:80px;border-radius:16px;background:var(--plate);display:grid;place-items:center;padding:6px;border:1px solid var(--line)}
.plate img{width:100%;height:100%;object-fit:contain}
.loja-card h2{font-size:22px;font-weight:800}
.aberto{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ok)}
.aberto i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.aberto.fechado{color:var(--danger)}
.loja-meta{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-top:1px solid var(--line);padding-top:10px;text-align:center}
.loja-meta div + div{border-left:1px solid var(--line)}
.loja-meta b{display:block;font-family:var(--display);font-size:17px;font-weight:700}
.loja-meta span{font-size:11.5px;color:var(--muted)}
.fechado-aviso{margin:12px 14px 0;background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.busca{margin:14px 14px 0;position:relative}
.busca input{padding-left:40px;border-radius:14px;border-color:transparent;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--surface2) 92%,transparent);backdrop-filter:blur(8px);display:flex;gap:6px;overflow-x:auto;padding:12px 14px 10px;scrollbar-width:none}
.cats button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--muted)}
.cats button.on{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.sec{padding:14px 14px 0}
.sec h3{font-size:21px;font-weight:700;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.sec h3 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.ofertas{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.oferta{flex:none;width:146px;background:var(--surface);border-radius:18px;padding:8px;scroll-snap-align:start;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
.oferta .thumb{width:100%;height:100px;font-size:50px}
.oferta strong{display:block;font-size:13.5px;font-weight:600;margin-top:7px;line-height:1.2;min-height:33px}
.oferta .preco s{width:100%;margin-bottom:-4px}
.lista{background:var(--surface);border-radius:18px;overflow:hidden}
.prod{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;padding:12px;cursor:pointer}
.prod + .prod{border-top:1px solid var(--line)}
.prod strong{display:block;font-weight:600;font-size:15px}
.prod .un{font-size:12.5px;color:var(--muted)}
.preco{margin-top:6px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.preco b{font-family:var(--display);font-size:20px;font-weight:700}
.preco s{font-size:12.5px;color:var(--muted)}
.preco small{font-size:12px;color:var(--muted);margin-left:-4px}
.thumb{position:relative;height:96px;border-radius:16px;background:hsl(var(--h) var(--ts) var(--tl));display:grid;place-items:center;font-size:44px;line-height:1}
.off{position:absolute;top:6px;left:6px;background:var(--dark);color:var(--amber);font-weight:700;font-size:11.5px;border-radius:7px;padding:2px 6px;font-family:var(--body)}
.ctl{position:absolute;right:6px;bottom:6px}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:var(--amber);color:var(--on-amber);font-size:22px;font-weight:700;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.step{display:flex;align-items:center;background:var(--dark);color:var(--on-dark);border-radius:99px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.step button{width:30px;height:32px;border:0;background:transparent;color:var(--amber);font-size:19px;font-weight:700;line-height:1;padding:0}
.step span{font-size:12.5px;font-weight:700;min-width:30px;text-align:center}
.step.inline{background:var(--surface2);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.step.inline button{color:var(--ink)}
.vazio{text-align:center;color:var(--muted);padding:36px 16px}

.barra-sacola{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;display:flex;align-items:center;gap:12px;background:var(--dark);color:var(--on-dark);border:0;border-radius:18px;padding:12px 16px;box-shadow:0 10px 24px rgba(0,0,0,.3);text-align:left}
.barra-sacola .qt{background:var(--amber);color:var(--on-amber);border-radius:9px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:700}
.barra-sacola span{flex:1;font-weight:600}
.barra-sacola b{font-family:var(--display);font-size:20px;color:var(--amber)}

/* folhas (produto, sacola, finalizar) dentro do celular */
.folha{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end}
.folha .fundo{position:absolute;inset:0;background:rgba(10,10,8,.5);animation:aparece .2s}
.folha .corpo{position:relative;background:var(--surface2);border-radius:24px 24px 0 0;max-height:94%;overflow-y:auto;padding:16px 16px 18px;animation:sobe .24s cubic-bezier(.2,.8,.2,1)}
.folha.cheia .corpo{max-height:100%;height:100%;border-radius:0}
@keyframes sobe{from{transform:translateY(60px);opacity:.4}}
@keyframes aparece{from{opacity:0}}
.f-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.f-head h2{flex:1;font-size:24px;font-weight:800}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);font-size:17px;font-weight:700;flex:none}
.bloco{background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.bloco h4{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.linha-item{display:flex;align-items:center;gap:10px;padding:9px 0}
.linha-item + .linha-item{border-top:1px solid var(--line)}
.linha-item .mini{width:42px;height:42px;border-radius:11px;font-size:22px;flex:none}
.linha-item div.t{flex:1;min-width:0}
.linha-item div.t span{display:block;font-size:12.5px;color:var(--muted)}
.frete{font-size:13.5px;background:var(--amber-soft)}
.frete .trilho{height:8px;border-radius:99px;background:color-mix(in srgb,var(--amber) 25%,var(--surface));margin-top:7px;overflow:hidden}
.frete .trilho i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .4s}
.sugestoes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sug{flex:none;width:112px;background:var(--surface2);border-radius:14px;padding:6px}
.sug .thumb{height:70px;font-size:34px;border-radius:12px}
.sug strong{display:block;font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.2;min-height:30px}
.sug .preco b{font-size:16px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-family:var(--display);font-weight:800;font-size:23px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.gratis{color:var(--ok);font-weight:700}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:15px;background:var(--amber);color:var(--on-amber);font-weight:700;font-size:16px;text-align:center}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.cta.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.cta.escuro{background:var(--dark);color:var(--on-dark)}
.nota{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.erro{color:var(--danger);font-weight:600;font-size:14px;margin:0 0 10px}
.erro:empty{display:none}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.chip.on{border-color:var(--ink);background:var(--dark);color:var(--on-dark)}
.tipo{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.tipo button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600}
.tipo button.on{background:var(--amber);color:var(--on-amber)}
.prod-grande .thumb{height:200px;font-size:100px;margin-bottom:12px;border-radius:20px}

/* acompanhamento */
.acomp-top{background:var(--amber);color:var(--on-amber);padding:20px 18px 24px;position:relative;overflow:hidden}
.acomp-top::before{content:"";position:absolute;width:220px;height:180px;right:-60px;top:-50px;border-radius:50%;border:28px solid rgba(255,255,255,.28)}
.acomp-top small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;position:relative}
.acomp-top h2{font-size:30px;font-weight:800;margin-top:4px;position:relative}
.acomp-top p{margin:6px 0 0;position:relative;font-weight:500}
.passos{list-style:none;margin:0;padding:0}
.passos li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:0 0 16px;position:relative}
.passos li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.passos li:last-child::before{display:none}
.passos li.feito::before{background:var(--ink)}
.passos .bola{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1}
.passos li.feito .bola{background:var(--dark);border-color:var(--dark)}
.passos li.atual .bola{border-color:var(--amber);background:var(--amber);box-shadow:0 0 0 5px color-mix(in srgb,var(--amber) 28%,transparent)}
.passos li.feito .bola::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--amber);border-width:0 2px 2px 0;transform:rotate(45deg)}
.passos b{display:block;font-weight:600}
.passos span{font-size:12.5px;color:var(--muted)}
.passos time{font-size:12.5px;color:var(--muted)}
.passos li:not(.feito):not(.atual) b{color:var(--muted);font-weight:500}
.chat{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{background:var(--bubble);border-radius:12px 12px 12px 3px;padding:8px 10px;font-size:14px;max-width:92%;white-space:pre-line}
.msg time{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}

/* notificação do WhatsApp no celular */
.push{position:absolute;left:10px;right:10px;top:10px;z-index:20;background:var(--surface);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.push.on{transform:none}
.push .ic{width:34px;height:34px;border-radius:10px;background:var(--wa);display:grid;place-items:center;flex:none}
.push b{font-size:13px}
.push small{color:var(--muted);font-size:12px;margin-left:4px}
.push p{margin:2px 0 0;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- gestor ---------- */
.gestor{min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.g-top{background:var(--dark);color:var(--on-dark);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.g-top img{width:40px;height:40px;flex:none}
.g-top div.t{flex:1;min-width:160px}
.g-top h2{font-size:22px;font-weight:700}
.g-top small{color:#B9B4AA;font-size:13px}
.g-corpo{padding:16px;display:grid;gap:14px}
.switch{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px 7px 7px;font-weight:600;font-size:14px}
.switch i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on i{background:var(--ok)}
.switch.on i::after{transform:translateX(16px)}
.g-top .switch{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:var(--on-dark)}
.metricas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metricas div{background:var(--surface);border-radius:16px;padding:12px 14px}
.metricas b{display:block;font-family:var(--display);font-size:26px;font-weight:700}
.metricas span{font-size:12.5px;color:var(--muted)}
.metricas div:first-child{background:var(--amber);color:var(--on-amber)}
.metricas div:first-child span{color:var(--on-amber);opacity:.75}
.autos{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.autos h4{margin:0 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.autos .switch{border:0;background:var(--surface2)}
.kanban-wrap{overflow-x:auto;padding-bottom:4px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;min-width:840px}
.col{background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:18px;padding:10px;min-height:280px}
.col header{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-weight:700;font-size:14px}
.col header i{width:10px;height:10px;border-radius:50%}
.col header span{margin-left:auto;background:var(--surface);border-radius:8px;padding:1px 8px;font-size:13px}
.col .cards{display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--surface);border-radius:14px;padding:11px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;animation:entra .35s ease-out;border:1.5px solid transparent}
.kcard:hover{border-color:var(--line)}
@keyframes entra{from{transform:translateY(-8px);opacity:0}}
.kcard.novo{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 35%,transparent),0 6px 18px rgba(0,0,0,.1);animation:entra .35s ease-out,pisca 1.4s ease-in-out 3}
@keyframes pisca{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--amber) 35%,transparent),0 6px 18px rgba(0,0,0,.1)}}
.kcard header{display:flex;align-items:center;gap:6px}
.kcard header b{font-family:var(--display);font-size:19px;font-weight:700}
.novo-tag{background:var(--amber);color:var(--on-amber);font-size:10.5px;font-weight:800;letter-spacing:.06em;border-radius:5px;padding:1px 5px}
.kcard .tempo{margin-left:auto;font-size:12px;color:var(--muted)}
.kcard .tempo.atraso{color:var(--danger);font-weight:700}
.kc-nome{font-weight:600;margin-top:3px}
.kc-meta{font-size:12.5px;color:var(--muted)}
.kc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.kc-foot strong{font-family:var(--display);font-size:17px;font-weight:700}
.tag{font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
.auto-cd{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.auto-cd .anel{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--amber-2) calc(var(--p)*1%),var(--line) 0)}
.kbtn{width:100%;margin-top:9px;border:0;border-radius:10px;padding:9px;background:var(--dark);color:var(--on-dark);font-weight:600;font-size:14px}
.kbtn.aceitar{background:var(--amber);color:var(--on-amber)}
.col-vazia{font-size:13px;color:var(--muted);text-align:center;padding:22px 8px;border:1.5px dashed var(--line);border-radius:14px}
.robo{background:var(--surface);border-radius:16px;padding:12px 14px}
.robo h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.robo ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.robo li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;font-size:13.5px;align-items:baseline}
.robo li time{color:var(--muted);font-size:12px}
.robo li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

/* gaveta de detalhes */
.gaveta{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}
.gaveta .fundo{position:absolute;inset:0;background:rgba(10,10,8,.45);animation:aparece .2s}
.gaveta .corpo{position:relative;width:min(420px,100%);height:100%;overflow-y:auto;background:var(--surface2);padding:18px 16px 24px;animation:lado .25s cubic-bezier(.2,.8,.2,1)}
@keyframes lado{from{transform:translateX(40px);opacity:.5}}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--surface);border-radius:99px;padding:4px 10px}
.st i{width:8px;height:8px;border-radius:50%}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes .cta{flex:1;min-width:150px}
.cta.perigo{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dark);color:var(--on-dark);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;max-width:90vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}

@media (max-width:1060px){
  .palco{grid-template-columns:minmax(0,1fr)}
  .seg{display:flex}
  .celular{width:100%;max-width:480px;margin:0 auto;height:calc(100dvh - 160px);min-height:560px;border:1px solid var(--line);border-radius:24px;position:relative;top:0}
  body[data-painel="cliente"] .gestor{display:none}
  body[data-painel="gestor"] .celular{display:none}
  .metricas{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .demo-top{align-items:flex-start}
  .demo-top .marca{width:36px;height:36px;margin-top:2px}
  .demo-top .t{min-width:0;flex-basis:calc(100% - 48px)}
  .demo-top .btn{flex:1}
  .metricas b{font-size:21px}
  .g-corpo{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let ac;
function bip(){
  if(!G.som) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime;
    [[0,880],[0.2,1320],[0.4,1760]].forEach(([d,f])=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.18,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.17);
      o.connect(g).connect(ac.destination); o.start(t+d); o.stop(t+d+0.18); });
  }catch(e){}
}

// G simula o banco de dados compartilhado entre o celular do cliente e o gestor
let G, C;
function estadoInicial(){
  const agora = Date.now(), min = 60000;
  G = {aberto:true, autoAceite:true, autoMsg:true, som:true, seq:1040, pedidos:[], robo:[], detalhe:null, confirmaCancel:false};
  C = {cart:{}, busca:'', cat:'Ofertas', folha:null, prod:null, meuPedido:null, tela:'cardapio', erro:'',
    form:{tipo:'entrega', nome:'Ana Souza', tel:'(22) 99876-5432', end:'Rua das Palmeiras, 85', bairro:'Centro', pag:'Pix', troco:''}};
  // pedidos de exemplo para o gestor não abrir vazio
  [[52,'concluido',['p13',1],['p0',1.5],['p10',6]], [26,'entrega',['p5',1],['p18',2],['p8',0.5]], [9,'separacao',['p15',2],['p11',0.5],['p21',3],['p4',1]]]
    .forEach(([m,st,...its],k)=>{
      const p = montarPedido({nome:NOMES[k], tel:'(22) 9'+(8800+k*111)+'-'+(1200+k*37), end:RUAS[k]+', '+(120+k*33), bairro:LOJA.bairros[k][0], tipo:'entrega', pag:['Pix','Cartão','Dinheiro'][k], troco:k===2?'100':''},
        its.map(([id,q])=>({id,q})), agora-m*min);
      p.hist.separacao = p.criado+2*min;
      if(st!=='separacao') p.hist.entrega = p.criado+18*min;
      if(st==='concluido') p.hist.concluido = p.criado+44*min;
      p.status = st; G.pedidos.push(p);
    });
}
function montarPedido(f, itens, criado){
  const its = itens.map(({id,q})=>{ const p = prodPor(id); return {id, nome:p.nome, un:p.un, ic:p.ic, cat:p.cat, preco:p.preco, q, valor:p.preco*q}; });
  const sub = its.reduce((s,i)=>s+i.valor,0), taxa = taxaEntrega(f.tipo, f.bairro, sub);
  return {n:++G.seq, criado, status:'analise', hist:{analise:criado}, tipo:f.tipo, novo:false, aceitarEm:0,
    cliente:{nome:f.nome, tel:f.tel, end:f.end, bairro:f.bairro}, pag:f.pag, troco:f.troco, itens:its, sub, taxa, total:sub+taxa};
}
function taxaEntrega(tipo, bairro, sub){
  if(tipo==='retirada' || sub>=LOJA.freteGratis) return 0;
  return (LOJA.bairros.find(b=>b[0]===bairro)||LOJA.bairros[0])[1];
}
const itensSacola = () => Object.entries(C.cart).map(([id,q])=>({...prodPor(id), q}));
const subSacola = () => itensSacola().reduce((s,i)=>s+i.preco*i.q,0);
const statusTxt = p => p.tipo==='retirada' && p.status==='entrega' ? STATUS.entrega.tr : STATUS[p.status].t;

function previsao(p){
  const base = (p.hist.separacao||Date.now()) + LOJA.preparo*60000;
  return p.tipo==='retirada' ? `a partir de ${hora(base)}` : `entre ${hora(base+10*60000)} e ${hora(base+25*60000)}`;
}
function textoRobo(p){
  const nome = p.cliente.nome.split(' ')[0];
  return {
    analise:`Olá, ${nome}! Recebemos seu pedido #${p.n} no Tinoco. Total ${fmt(p.total)}. Em instantes confirmamos.`,

}
function enviarRobo(p){

function mostrarPush(texto){

function novoPedido(p){
  p.novo = true;

}
function mudarStatus(p, st){
  p.status = st; p.hist[st] = Date.now(); p.novo = false; p.aceitarEm = 0;

// relógio: aceite automático e tempos nos cards
setInterval(()=>{
  const agora = Date.now();
  G.pedidos.filter(p=>p.status==='analise' && p.aceitarEm && agora>=p.aceitarEm).forEach(p=>{ mudarStatus(p,'separacao'); toast(`Pedido #${p.n} aceito automaticamente`); });
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const p = G.pedidos.find(x=>x.n===+el.dataset.cd); if(!p || !p.aceitarEm) return;
    const falta = Math.max(0, Math.ceil((p.aceitarEm-agora)/1000));
    el.querySelector('em').textContent = falta+' s';
    el.querySelector('.anel').style.setProperty('--p', 100 - falta/LOJA.aceiteSeg*100);
  });
  document.querySelectorAll('[data-desde]').forEach(el=>{
    const t = +el.dataset.desde; el.textContent = desde(t);
    el.classList.toggle('atraso', el.dataset.ativo==='1' && agora-t > 45*60000);
  });
}, 1000);

function mudarQtd(id, dir){

function pedir(){
  const f = C.form, falha = t => { C.erro = t; renderFolha(); };
  if(!f.nome.trim()) return falha('Preencha seu nome.');
  if(f.tel.replace(/\D/g,'').length<10) return falha('Preencha o WhatsApp com DDD.');
  if(f.tipo==='entrega' && !f.end.trim()) return falha('Preencha a rua e o número.');
  C.erro = '';
  const p = montarPedido({...f, nome:f.nome.trim(), end:f.end.trim()}, Object.entries(C.cart).map(([id,q])=>({id,q})), Date.now());
  C.cart = {}; C.folha = null; C.meuPedido = p.n; C.tela = 'acompanhar';
  novoPedido(p);
  renderFolha(); renderApp(); $('app').scrollTop = 0;
  if(matchMedia('(max-width:1060px)').matches) setTimeout(()=>toast('Pedido enviado. Abra o Gestor de pedidos para ver ele chegar.'), 4500);
}
function htmlAcompanhar(){
  const p = G.pedidos.find(x=>x.n===C.meuPedido); if(!p) return '';
  const passos = [['analise','Pedido enviado','O mercado está conferindo'],['separacao','Pedido aceito','Separando seus produtos'],
    ['entrega', p.tipo==='retirada'?'Pronto para retirada':'Saiu para entrega', p.tipo==='retirada'?'Retire no caixa 1':'O entregador está a caminho'],['concluido', p.tipo==='retirada'?'Retirado':'Entregue','Bom apetite!']];
  const idx = ORDEM.indexOf(p.status), cancel = p.status==='cancelado';
  const titulo = cancel ? 'Pedido cancelado' : {analise:'Aguardando confirmação', separacao:'Separando seu pedido', entrega:p.tipo==='retirada'?'Pronto para retirar':'A caminho', concluido:p.tipo==='retirada'?'Pedido retirado':'Pedido entregue'}[p.status];
  const sub = cancel ? 'Fale com o mercado pelo WhatsApp se tiver dúvida.' : p.status==='concluido' ? 'Obrigado pela compra!' : p.status==='analise' ? 'O mercado confirma em instantes.' : 'Previsão: '+previsao(p);
  return `<div class="acomp-top"><small>Pedido #${p.n}</small><h2>${titulo}</h2><p>${sub}</p></div>
    <div class="sec">
      <div class="bloco"><ol class="passos">${passos.map(([st,t,d],i)=>{
        const feito = !cancel && (i<idx || (i===idx && st==='concluido')), atual = !cancel && i===idx && st!=='concluido';
        return `<li class="${feito?'feito':''} ${atual?'atual':''}"><span class="bola"></span><div><b>${t}</b>${atual?`<span>${d}</span>`:''}</div><time>${p.hist[st]?hora(p.hist[st]):''}</time></li>`; }).join('')}</ol></div>
      <div class="bloco"><h4>Mensagens no seu WhatsApp</h4><div class="chat">${(p.msgs||[]).map(m=>`<div class="msg">${esc(m.texto)}<time>${hora(m.t)}</time></div>`).join('') || '<span class="nota">Nenhuma mensagem ainda.</span>'}</div></div>
      <div class="bloco"><h4>Resumo</h4>${p.itens.map(i=>`<div class="linha-item">${thumb(i,'mini')}<div class="t">${esc(i.nome)}<span>${qtdTxt(i.q,i.un)}</span></div><span class="num">${fmt(i.valor)}</span></div>`).join('')}
        <div class="tot" style="margin-top:8px"><div><span>Entrega</span><span class="num">${p.taxa?fmt(p.taxa):'Grátis'}</span></div><div class="g"><span>Total</span><span class="num">${fmt(p.total)}</span></div></div>
        <p class="nota">Pagamento: ${esc(p.pag)}${p.troco?` · troco para R$ ${esc(p.troco)}`:''}</p></div>
      <button class="cta sec" data-a="novoPedido">Fazer outro pedido</button>

      ${sw('aberto', G.aberto?'Loja aberta':'Loja fechada')}</div>
    <div class="g-corpo">
    <div class="metricas">
      <div><b class="num">${validos.length}</b><span>pedidos hoje</span></div>
      <div><b class="num">${fmt(fat)}</b><span>faturamento</span></div>
      <div><b class="num">${fmt(validos.length?fat/validos.length:0)}</b><span>ticket médio</span></div>

    <div class="kanban-wrap"><div class="kanban">${ORDEM.map(st=>{
      const lista = P.filter(p=>p.status===st).sort((a,b)=>st==='concluido'?b.n-a.n:a.n-b.n);
      return `<div class="col"><header><i style="background:${STATUS[st].c}"></i>${STATUS[st].t}<span class="num">${lista.length}</span></header>
        <div class="cards">${lista.map(cardG).join('') || `<div class="col-vazia">${st==='analise'?'Pedidos novos aparecem aqui':'Nenhum pedido'}</div>`}</div></div>`; }).join('')}</div></div>
    <div class="robo"><h4>Mensagens enviadas pelo robô</h4>${G.robo.length?`<ul>${G.robo.slice(0,6).map(m=>`<li><time>${hora(m.t)}</time><b>#${m.n}</b><span>${esc(m.nome)}: ${esc(m.texto.replace(/\n/g,' '))}</span></li>`).join('')}</ul>`:'<p class="nota">Quando um pedido mudar de etapa, a mensagem enviada ao cliente aparece aqui.</p>'}</div>
    </div>`;
}
function cardG(p){
  const ativo = p.status!=='concluido';
  const cd = p.status==='analise' && p.aceitarEm ? Math.max(0,Math.ceil((p.aceitarEm-Date.now())/1000)) : null;
  const acao = p.status==='separacao'&&p.tipo==='retirada' ? 'Pronto para retirada' : PROX[p.status];
  return `<article class="kcard ${p.novo?'novo':''}" data-a="detalhe" data-n="${p.n}" tabindex="0">
    <header><b>#${p.n}</b>${p.novo?'<span class="novo-tag">NOVO</span>':''}<span class="tempo" data-desde="${p.criado}" data-ativo="${ativo?1:0}">${desde(p.criado)}</span></header>
    <div class="kc-nome">${esc(p.cliente.nome)}</div>
    <div class="kc-meta">${p.tipo==='retirada'?'Retirada na loja':esc(p.cliente.bairro)} · ${p.itens.length} ${p.itens.length>1?'itens':'item'}</div>
    <div class="kc-foot"><strong class="num">${fmt(p.total)}</strong><span class="tag">${esc(p.pag)}</span></div>
    ${cd!==null?`<div class="auto-cd" data-cd="${p.n}"><span class="anel" style="--p:${100-cd/LOJA.aceiteSeg*100}"></span>Aceite automático em <em>${cd} s</em></div>`:''}
    ${acao?`<button class="kbtn ${p.status==='analise'?'aceitar':''}" data-a="avancar" data-n="${p.n}">${acao}</button>`:''}
  </article>`;
}
function renderGaveta(){
  const el = $('gaveta'), p = G.pedidos.find(x=>x.n===G.detalhe);
  if(!p){ el.innerHTML=''; return; }
  const c = p.cliente, acao = p.status==='separacao'&&p.tipo==='retirada' ? 'Pronto para retirada' : PROX[p.status];
  el.innerHTML = `<div class="gaveta"><div class="fundo" data-a="fecharDet"></div><div class="corpo" role="dialog" aria-modal="true" aria-label="Pedido ${p.n}">
    <div class="f-head"><h2>Pedido #${p.n}</h2><button class="x" data-a="fecharDet" aria-label="Fechar">✕</button></div>
    <p style="margin:0 0 12px;display:flex;gap:8px;align-items:center"><span class="st"><i style="background:${STATUS[p.status].c}"></i>${statusTxt(p)}</span><span class="nota" style="margin:0">feito às ${hora(p.criado)}</span></p>
    <div class="bloco"><h4>Cliente</h4><b>${esc(c.nome)}</b><br>${esc(c.tel)}<br>${p.tipo==='retirada'?'Retirada na loja':`${esc(c.end)} · ${esc(c.bairro)}`}</div>
    <div class="bloco"><h4>Itens para separar</h4>${p.itens.map(i=>`<div class="linha-item">${thumb(i,'mini')}<div class="t"><b>${qtdTxt(i.q,i.un)}</b> ${esc(i.nome)}</div><span class="num">${fmt(i.valor)}</span></div>`).join('')}
      <div class="tot" style="margin-top:8px"><div><span>Produtos</span><span class="num">${fmt(p.sub)}</span></div><div><span>Entrega</span><span class="num">${p.taxa?fmt(p.taxa):'Grátis'}</span></div>
      <div class="g"><span>Total</span><span class="num">${fmt(p.total)}</span></div></div>
      <p class="nota">Pagamento: ${esc(p.pag)}${p.troco?` · levar troco para R$ ${esc(p.troco)}`:''}</p></div>
    ${(p.msgs||[]).length?`<div class="bloco"><h4>Mensagens enviadas</h4><div class="chat">${p.msgs.map(m=>`<div class="msg">${esc(m.texto)}<time>${hora(m.t)}</time></div>`).join('')}</div></div>`:''}
    ${acao?`<div class="acoes"><button class="cta ${p.status==='analise'?'':'escuro'}" data-a="avancar" data-n="${p.n}">${acao}</button>
      <button class="cta perigo" data-a="cancelar" data-n="${p.n}">${G.confirmaCancel?'Confirmar cancelamento':'Cancelar pedido'}</button></div>`:''}
  </div></div>`;
}
function badge(){
  const n = G.pedidos.filter(p=>p.novo).length, b = $('segBadge');
  b.hidden = !n; b.textContent = n;
}

// ================== EVENTOS ==================
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-a]'); if(!el) return;
  const d = el.dataset;
  switch(d.a){
    case 'painel':
      document.body.dataset.painel = d.p;
      document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.p===d.p)); break;
    case 'mais': mudarQtd(d.id, 1); break;
    case 'menos': mudarQtd(d.id, -1); break;
    case 'abrirProd': C.prod = d.id; C.folha = 'produto'; renderFolha(); break;
    case 'folha': C.folha = d.f; C.erro = ''; renderFolha(); break;
    case 'fechar': C.folha = null; renderFolha(); break;
    case 'cat': {
      C.cat = d.c; const alvo = document.querySelector(`[data-sec="${CSS.escape(d.c)}"]`);
      if(alvo) $('app').scrollTo({top: alvo.offsetTop - $('cats').offsetHeight + 4, behavior:'smooth'});
      break; }
    case 'tipo': C.form.tipo = d.t; renderFolha(); break;
    case 'pag': C.form.pag = d.v; renderFolha(); break;
    case 'pedir': pedir(); break;
    case 'novoPedido': C.tela = 'cardapio'; C.meuPedido = null; renderApp(); $('app').scrollTop = 0; break;
    case 'toggle':
      G[d.k] = !G[d.k];
      if(d.k==='autoAceite') G.pedidos.forEach(p=>{ if(p.status==='analise') p.aceitarEm = G.autoAceite ? Date.now()+LOJA.aceiteSeg*1000 : 0; });
      if(d.k==='som' && G.som) bip();
      if(d.k==='aberto'){ if(C.tela==='cardapio') renderApp(); if(C.folha) renderFolha(); }
      renderGestor(); break;
    case 'avancar': { const p = G.pedidos.find(x=>x.n===+d.n); mudarStatus(p, ORDEM[ORDEM.indexOf(p.status)+1]); break; }
    case 'detalhe': { const p = G.pedidos.find(x=>x.n===+d.n); p.novo = false; G.detalhe = p.n; G.confirmaCancel = false; renderGaveta(); badge(); break; }
    case 'fecharDet': G.detalhe = null; renderGaveta(); renderGestor(); break;
    case 'cancelar': {
      const p = G.pedidos.find(x=>x.n===+d.n);
      if(G.confirmaCancel){ G.confirmaCancel = false; mudarStatus(p,'cancelado'); toast(`Pedido #${p.n} cancelado`); }
      else { G.confirmaCancel = true; renderGaveta(); }
      break; }
    case 'simular': {
      const its = [...PRODUTOS].sort(()=>Math.random()-.5).slice(0, 2+Math.floor(Math.random()*4)).map(p=>({id:p.id, q:p.un==='kg'?rnd([0.5,1,1.5]):rnd([1,2,3])}));
      const tipo = Math.random()<.2 ? 'retirada' : 'entrega';
      const p = montarPedido({nome:rnd(NOMES), tel:'(22) 9'+(8000+Math.floor(Math.random()*1999))+'-'+(1000+Math.floor(Math.random()*8999)), end:rnd(RUAS)+', '+(10+Math.floor(Math.random()*400)), bairro:rnd(LOJA.bairros)[0], tipo, pag:rnd(['Pix','Cartão','Dinheiro']), troco:''}, its, Date.now());
      novoPedido(p); toast(`Novo pedido #${p.n} de ${p.cliente.nome}`); break; }
    case 'reiniciar': estadoInicial(); renderApp(); renderFolha(); renderGestor(); renderGaveta(); badge(); $('app').scrollTop = 0; toast('Demonstração reiniciada'); break;
  }
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape'){ if(G.detalhe){ G.detalhe=null; renderGaveta(); } else if(C.folha){ C.folha=null; renderFolha(); } }
  if(ev.key==='Enter' && ev.target.classList?.contains('kcard')) ev.target.click();
});
let buscaT;
document.addEventListener('input', ev=>{
  const f = ev.target.dataset?.f;
  if(f) C.form[f] = ev.target.value;
  if(ev.target.id==='busca'){
    C.busca = ev.target.value; clearTimeout(buscaT);
    buscaT = setTimeout(()=>{ const pos = ev.target.selectionStart; renderApp(); const b = $('busca'); b.focus(); b.setSelectionRange(pos,pos); }, 180);
  }
});
document.addEventListener('change', ev=>{ if(ev.target.dataset?.f==='bairro'){ C.form.bairro = ev.target.value; renderFolha(); } });
// destaca a categoria visível enquanto rola o cardápio
$('app').addEventListener('scroll', ()=>{
  const cats = $('cats'); if(!cats || C.tela!=='cardapio') return;
  const topo = $('app').scrollTop + cats.offsetHeight + 20;
  let atual = 'Ofertas';
  document.querySelectorAll('[data-sec]').forEach(s=>{ if(s.offsetTop <= topo) atual = s.dataset.sec; });
  if(atual!==C.cat){
    C.cat = atual;
    cats.querySelectorAll('button').forEach(b=>{ const on = b.dataset.c===atual; b.classList.toggle('on', on); if(on) cats.scrollTo({left: b.offsetLeft - cats.clientWidth/2 + b.offsetWidth/2, behavior:'smooth'}); });
  }
}, {passive:true});

estadoInicial(); renderApp(); renderGestor(); badge();
</script>
</body>
</html>
